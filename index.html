<!DOCTYPE html>
<html>
<head><title>TL Power-Up v2</title></head>
<body>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
  TrelloPowerUp.initialize({
    'board-buttons': function(t, options) {
      return [{
        text: 'TL',
        callback: function(t) {
          return t.popup({
            title: 'משימות הבורד',
            url: './popup.html',
            height: 500
          });
        }
      }];
    }
  });
</script>
</body>
</html>
